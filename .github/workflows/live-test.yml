name: Live Feed Test

on:
  workflow_dispatch:

jobs:
  test-live-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install websockets

      - name: Test OTC WebSocket
        run: |
          python - <<'PY'
          import asyncio
          import websockets

          WS_URL = "wss://ws2.qxbroker.com/socket.io/?EIO=3&transport=websocket"

          async def main():
              print("Connecting to OTC WebSocket...")

              try:
                  async with websockets.connect(
                      WS_URL,
                      ping_interval=20,
                      ping_timeout=20,
                      open_timeout=20
                  ) as ws:

                      print("WebSocket connected.")
                      print("Waiting for server data...")

                      for i in range(10):
                          try:
                              message = await asyncio.wait_for(
                                  ws.recv(),
                                  timeout=10
                              )
                              print("RAW:", str(message)[:500])
                          except asyncio.TimeoutError:
                              print("No data received in 10 seconds.")
                              break

              except Exception as e:
                  print("WebSocket test failed:", repr(e))

          asyncio.run(main())
          PY
