name: Live Feed Test

on:
  workflow_dispatch:

jobs:
  test-live-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run live feed test
        run: python live_test.py
