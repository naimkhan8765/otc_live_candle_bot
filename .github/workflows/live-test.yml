name: Live Feed Test

on:
  workflow_dispatch:

jobs:
  test-live-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show repository files
        run: |
          pwd
          echo "=== FILES ==="
          find . -maxdepth 3 -type f -print

      - name: Install dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install websockets

      - name: Find and run OTC WebSocket test
        run: |
          FILE=$(find . -type f -name "otc_ws_test.py" | head -n 1)

          if [ -z "$FILE" ]; then
            echo "ERROR: otc_ws_test.py was not found"
            exit 1
          fi

          echo "Found test file: $FILE"
          python "$FILE"
