name: Live Feed Test

on:
  workflow_dispatch:

jobs:
  test-live-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify OTC test file
        run: |
          pwd
          ls -la
          test -f otc_ws_test.py
          echo "otc_ws_test.py FOUND"

      - name: Install dependency
        run: python -m pip install websockets

      - name: Run OTC WebSocket test
        run: python otc_ws_test.py
