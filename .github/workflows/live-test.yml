name: Live Feed Test

on:
  workflow_dispatch:

jobs:
  test-live-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show repository files
        run: ls -la

      - name: Install dependency
        run: python -m pip install websockets

      - name: Run OTC WebSocket test
        run: python otc_ws_test.py
